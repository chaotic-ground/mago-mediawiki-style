# A mago configuration that aims to reproduce the MediaWiki coding style
# (mediawiki/mediawiki-codesniffer) as closely as mago allows.
#
# A zero diff against MediaWiki core is not reachable yet; see README.md
# for the list of known differences that cannot be configured away.
#
# This file holds only the style (formatter) rules so other projects can
# `extends` it. The repo's own mago.toml adds the php-version and source
# paths that the parity check needs.

[formatter]
print-width = 120
tab-width = 4
use-tabs = true
single-quote = true

# MediaWiki does not require trailing commas.
trailing-comma = false

# MediaWiki places every opening brace on the same line.
control-brace-style = "same-line"
closure-brace-style = "same-line"
function-brace-style = "same-line"
method-brace-style = "same-line"
classlike-brace-style = "same-line"

# MediaWiki: `(int)$var`, not `(int) $var`.
space-after-cast-unary-prefix-operators = false

# MediaWiki puts spaces inside grouping parentheses: `( $a + $b )`.
space-within-grouping-parenthesis = true

# MediaWiki spaces the parameter list off from the keyword, for arrow
# functions as much as for closures: `fn ( $x ) => $x`.
space-before-arrow-function-parameter-list-parenthesis = true

# MediaWiki keeps a broken binary expression's operator at the end of the
# line: `$a &&` and `'foo' .`, not a leading `&&` on the next line.
line-before-binary-operator = false

# MediaWiki relies on PHP's precedence rather than adding parentheses
# around arithmetic under a comparison: `$i === $retries - 1`.
omit-redundant-arithmetic-binary-expression-parentheses = true

# MediaWiki parenthesises `new` before a member access:
# `( new Foo )->bar()`, not PHP 8.4's `new Foo->bar()`.
parentheses-around-new-in-member-access = true

# MediaWiki writes heredoc bodies flush against the left margin.
indent-heredoc = false

# MediaWiki files start with `<?php` immediately followed by code or a
# file-level doc comment.
empty-line-after-opening-tag = false

# MediaWiki does not align array tables or assignments.
array-table-style-alignment = false

# Blank lines are the author's call. mago preserves the ones already in the
# source either way; these settings stop it from inserting more.
empty-line-after-symbols = false
empty-line-after-declare = false
empty-line-between-same-symbols = false
separate-class-like-members = false

# MediaWiki keeps a constructor's promoted properties on one line when they
# fit within the print width.
break-promoted-properties-list = false

# MediaWiki starts a broken chain on the receiver's line:
# `$store->newSelectQueryBuilder( $db )` followed by `->joinPage()`.
method-chain-breaking-style = "same_line"
first-method-chain-on-new-line = false

# Do not reorder or regroup use statements; MediaWiki core is not
# consistently sorted.
sort-uses = false
separate-use-types = false

# Preserve author line-breaking decisions to keep the diff minimal.
preserve-breaking-member-access-chain = true
preserve-breaking-member-access-chain-first-method-on-same-line = true
preserve-breaking-argument-list = true
preserve-breaking-parameter-list = true
preserve-breaking-attribute-list = true
preserve-breaking-conditional-expression = true
preserve-breaking-condition-expression = true
