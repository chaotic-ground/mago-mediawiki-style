# The parity tracker's own config: the shared style, plus the php-version and
# source paths the weekly parity check runs against MediaWiki core. Other
# projects depend on style.toml instead (see README.md).
extends = "style.toml"

# The newest PHP version supported by both MediaWiki and mago. The Parity
# workflow recomputes and rewrites it: mago's maximum capped by MediaWiki's
# documented upper bound, which mediawiki.org maintains as
# Template:MW stable php maximum requirement (transcluded by the
# Compatibility page).
php-version = "8.5"

[source]
paths = ["mediawiki"]
excludes = [
    "mediawiki/vendor",
    "mediawiki/node_modules",
]
