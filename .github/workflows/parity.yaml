name: Parity

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, to track both the latest MediaWiki core and the latest mago.
    - cron: '17 3 * * 1'
  workflow_dispatch:

concurrency:
  group: parity
  cancel-in-progress: false

permissions: {}

jobs:
  parity:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Resolve latest MediaWiki commit
        id: mediawiki
        run: |
          echo "sha=$(git ls-remote https://github.com/wikimedia/mediawiki.git HEAD | cut -f1)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: mediawiki
          key: mediawiki-src-${{ steps.mediawiki.outputs.sha }}
          restore-keys: |
            mediawiki-src-

      - name: Check out MediaWiki
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: wikimedia/mediawiki
          path: mediawiki
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Mago
        uses: nhedger/setup-mago@b1b8f89862e133daf595f9ec95c7193c36ccfc14 # v1.0.0

      - name: Pin php-version to the newest mutually supported
        id: php
        run: |
          mw_min=$(jq -r '.require.php' mediawiki/composer.json | grep -oE '[0-9]+\.[0-9]+' | head -1)
          mago_max=$(mago --php-version 99.0 config 2>&1 \
            | grep -oE 'maximum supported version is [0-9]+\.[0-9]+' \
            | grep -oE '[0-9]+\.[0-9]+$' || true)
          # MediaWiki's repo only encodes its lower bound; the documented upper
          # bound lives on mediawiki.org as a template (the Compatibility page
          # transcludes it). It documents the stable branch, which is the
          # closest maintained machine-readable value for core's support.
          mw_max=$(curl -s 'https://www.mediawiki.org/w/index.php?title=Template:MW_stable_php_maximum_requirement&action=raw' \
            | grep -oE '^[0-9]+\.[0-9]+' || true)
          if [ -z "$mw_min" ] || [ -z "$mago_max" ] || [ -z "$mw_max" ]; then
            echo "Could not detect versions (MediaWiki min: '$mw_min', mago max: '$mago_max', MediaWiki max: '$mw_max')" >&2
            exit 1
          fi
          version=$(printf '%s\n%s\n' "$mago_max" "$mw_max" | sort -V | head -1)
          if ! printf '%s\n%s\n' "$mw_min" "$version" | sort -V -C; then
            echo "::warning::newest mutual version ($version) is below MediaWiki's minimum ($mw_min)"
          fi
          echo "MediaWiki >= $mw_min and <= $mw_max, mago <= $mago_max -> $version"
          sed -i -E "s/^php-version = \"[^\"]*\"/php-version = \"$version\"/" mago.toml
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Format and measure
        id: measure
        env:
          MEDIAWIKI_SHA: ${{ steps.mediawiki.outputs.sha }}
          PHP_VERSION: ${{ steps.php.outputs.version }}
        run: |
          mago format

          changed=$(git -C mediawiki diff --name-only | wc -l)
          total=$(git -C mediawiki ls-files '*.php' | wc -l)
          shortstat=$(git -C mediawiki diff --shortstat | sed 's/^ *//')

          {
            echo "changed=${changed}"
            echo "total=${total}"
            echo "shortstat=${shortstat:-no changes}"
            echo "mago=$(mago --version)"
          } >> "$GITHUB_OUTPUT"

          {
            echo "## mago vs MediaWiki core"
            echo
            echo "- mago: $(mago --version)"
            echo "- MediaWiki: wikimedia/mediawiki@${MEDIAWIKI_SHA}"
            echo "- PHP version: ${PHP_VERSION}"
            echo "- PHP files: ${total}"
            echo "- Files mago would change: **${changed}**"
            echo "- ${shortstat:-no changes}"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "Files changed: ${changed} / ${total}"
          echo "${shortstat:-no changes}"

          # Keep a sample of the diff for the README before resetting.
          git -C mediawiki diff | head -20 > "$RUNNER_TEMP/parity-sample.diff"

          # Keep the cached checkout pristine.
          git -C mediawiki reset --hard --quiet

      - name: Update README and badge
        if: github.event_name != 'pull_request'
        env:
          CHANGED: ${{ steps.measure.outputs.changed }}
          TOTAL: ${{ steps.measure.outputs.total }}
          SHORTSTAT: ${{ steps.measure.outputs.shortstat }}
          MAGO: ${{ steps.measure.outputs.mago }}
          MEDIAWIKI_SHA: ${{ steps.mediawiki.outputs.sha }}
          PHP_VERSION: ${{ steps.php.outputs.version }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .github/badges
          if [ "$CHANGED" -eq 0 ]; then color=brightgreen; else color=orange; fi
          printf '{"schemaVersion":1,"label":"mago would change","message":"%s of %s files","color":"%s"}\n' \
            "$CHANGED" "$TOTAL" "$color" > .github/badges/parity.json

          # Build the metrics block in a file and splice it in with getline,
          # so backslashes in the diff sample survive (awk -v would mangle them).
          {
            echo
            printf -- '- Measured: %s\n- %s\n- MediaWiki: [wikimedia/mediawiki@%.7s](https://github.com/wikimedia/mediawiki/commit/%s)\n- PHP version: %s\n- Files mago would change: **%s** of %s PHP files\n- %s\n' \
              "$(date -u +%F)" "$MAGO" "$MEDIAWIKI_SHA" "$MEDIAWIKI_SHA" "$PHP_VERSION" "$CHANGED" "$TOTAL" "$SHORTSTAT"
            if [ -s "$RUNNER_TEMP/parity-sample.diff" ]; then
              echo
              echo 'First 20 lines of the diff:'
              echo
              # A four-backtick fence: a context line of the diff itself could
              # start with three backticks and would close a normal fence.
              # Trailing whitespace is stripped: empty diff context lines are a
              # single space, which markdown linters flag.
              echo '````diff'
              sed -E 's/[[:space:]]+$//' "$RUNNER_TEMP/parity-sample.diff"
              echo '````'
              echo
            fi
          } > "$RUNNER_TEMP/metrics.md"
          awk -v metricsfile="$RUNNER_TEMP/metrics.md" '
            /<!-- METRICS:START -->/ {
              print
              while ( ( getline line < metricsfile ) > 0 ) {
                print line
              }
              skip = 1
              next
            }
            /<!-- METRICS:END -->/ { skip = 0 }
            !skip
          ' README.md > README.md.tmp
          mv README.md.tmp README.md

          git add README.md mago.toml .github/badges/parity.json
          if git diff --cached --quiet; then
            echo "Metrics unchanged."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: update parity metrics [skip ci]'
          # The checkout does not persist credentials, so authenticate the
          # push explicitly.
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}"
          git push
